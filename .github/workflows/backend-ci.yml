name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aquaerp
          POSTGRES_PASSWORD: aquaerp
          POSTGRES_DB: aquaerp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquaerp -d aquaerp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://aquaerp:aquaerp@localhost:5432/aquaerp?schema=public
      API_PREFIX: api
      SWAGGER_ENABLED: 'false'
      CORS_ORIGIN: http://localhost:4200
      JWT_ACCESS_SECRET: ci-test-secret-with-at-least-32-characters
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SEED_ADMIN_EMAIL: admin@aquaerp.local
      SEED_ADMIN_PASSWORD: Admin123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run prisma:seed

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e
