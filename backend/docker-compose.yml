name: aquaerp

services:
  postgres:
    image: postgres:16-alpine
    container_name: aquaerp-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-aquaerp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquaerp} -d ${POSTGRES_DB:-aquaerp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
