<mat-sidenav-container class="shell">
  <mat-sidenav
    class="sidebar"
    [mode]="isCompact() ? 'over' : 'side'"
    [opened]="isCompact() ? sidebarOpen() : true"
    (openedChange)="sidebarOpen.set($event)"
  >
    <a class="brand" routerLink="/dashboard" (click)="closeOnCompact()">
      <span class="brand-symbol" aria-hidden="true"></span>
      <span>
        <strong>AquaERP</strong>
        <small>Gestión rural</small>
      </span>
    </a>

    <nav aria-label="Navegación principal">
      <p class="nav-heading">Operación</p>
      @for (item of navigation; track item.label) {
        @if (item.route) {
          <a
            class="nav-item"
            [routerLink]="item.route"
            routerLinkActive="active"
            (click)="closeOnCompact()"
          >
            <span class="nav-symbol">{{ item.shortLabel }}</span>
            <span>{{ item.label }}</span>
          </a>
        } @else {
          <span class="nav-item disabled" [attr.title]="item.status">
            <span class="nav-symbol">{{ item.shortLabel }}</span>
            <span>{{ item.label }}</span>
            <small>{{ item.status }}</small>
          </span>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <mat-divider />
      <p>AquaERP Rural</p>
      <small>Versión 0.1.0</small>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (isCompact()) {
        <button
          mat-button
          class="menu-button"
          type="button"
          aria-label="Abrir menú"
          (click)="sidebarOpen.set(true)"
        >
          Menú
        </button>
      }
      <span class="environment">
        <i aria-hidden="true"></i>
        Entorno de desarrollo
      </span>
      <span class="toolbar-spacer"></span>
      <button class="profile-button" [matMenuTriggerFor]="profileMenu">
        <span class="avatar">{{ initials() }}</span>
        <span class="profile-copy">
          <strong>{{ session.displayName() }}</strong>
          <small>{{ session.user()?.roles?.[0] ?? 'Usuario' }}</small>
        </span>
      </button>
      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item type="button" (click)="logout()">
          Cerrar sesión
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
