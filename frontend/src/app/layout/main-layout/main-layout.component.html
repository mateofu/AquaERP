<mat-sidenav-container class="shell" autosize>
  <mat-sidenav
    class="sidebar"
    [class.collapsed]="sidebarCollapsed() && !isCompact()"
    [mode]="isCompact() ? 'over' : 'side'"
    [opened]="isCompact() ? sidebarOpen() : true"
    (openedChange)="syncSidebarState($event)"
  >
    <a class="brand" routerLink="/dashboard" (click)="closeOnCompact()">
      <span class="brand-symbol" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path
            d="M24 4.5C18.5 12.2 10.5 20.7 10.5 29.2A13.5 13.5 0 0 0 37.5 29.2C37.5 20.7 29.5 12.2 24 4.5Z"
          />
          <path d="M17.5 30.2c.8 4 3.3 6.1 7.4 6.5" />
        </svg>
      </span>
      <span class="brand-copy">
        <strong>AquaERP</strong>
        <small>Gestión rural</small>
      </span>
    </a>

    <nav aria-label="Navegación principal">
      <p class="nav-heading">Operación</p>
      @for (item of navigation; track item.label) {
        @if (item.route) {
          <a
            class="nav-item"
            [routerLink]="item.route"
            routerLinkActive="active"
            [attr.title]="sidebarCollapsed() ? item.label : null"
            (click)="closeOnCompact()"
          >
            <span class="nav-symbol">
              <app-navigation-icon [name]="item.icon" />
            </span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        } @else {
          <span
            class="nav-item disabled"
            [attr.title]="
              sidebarCollapsed() ? item.label + ' · ' + item.status : item.status
            "
          >
            <span class="nav-symbol">
              <app-navigation-icon [name]="item.icon" />
            </span>
            <span class="nav-label">{{ item.label }}</span>
            <small>{{ item.status }}</small>
          </span>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <mat-divider />
      <p>AquaERP Rural</p>
      <small>Versión 0.1.0</small>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (isCompact()) {
        <button
          mat-button
          class="menu-button"
          type="button"
          aria-label="Abrir menú"
          (click)="sidebarOpen.set(true)"
        >
          Menú
        </button>
      }
      <span class="environment">
        <i aria-hidden="true"></i>
        Entorno de desarrollo
      </span>
      <span class="toolbar-spacer"></span>
      <button class="profile-button" [matMenuTriggerFor]="profileMenu">
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M5.5 20c.4-4.2 2.6-6.3 6.5-6.3s6.1 2.1 6.5 6.3" />
          </svg>
        </span>
        <span class="profile-copy">
          <strong>{{ session.displayName() }}</strong>
          <small>{{ session.user()?.roles?.[0] ?? 'Usuario' }}</small>
        </span>
      </button>
      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item type="button" (click)="logout()">
          Cerrar sesión
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

@if (!isCompact()) {
  <button
    class="sidebar-toggle"
    [class.sidebar-collapsed]="sidebarCollapsed()"
    type="button"
    [attr.aria-label]="sidebarCollapsed() ? 'Expandir menú' : 'Contraer menú'"
    [attr.title]="sidebarCollapsed() ? 'Expandir menú' : 'Contraer menú'"
    (click)="toggleSidebar()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" />
      <path d="M9 5v14" />
      @if (sidebarCollapsed()) {
        <path d="m13 9 3 3-3 3" />
      } @else {
        <path d="m16 9-3 3 3 3" />
      }
    </svg>
  </button>
}
